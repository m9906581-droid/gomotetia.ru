<script>
(function(){'use strict';
const $=id=>document.getElementById(id),KEY='deepkey_ai_futuristic_v1';const els={sidebar:$('sidebar'),overlay:$('overlay'),chatList:$('chatList'),messages:$('messages'),inner:$('messagesInner'),input:$('messageInput'),send:$('sendBtn'),file:$('fileInput'),preview:$('attachmentPreview'),status:$('statusText'),model:$('modelSelect'),depth:$('depthSelect'),toast:$('toast')};let chats=[],activeId=null,attachments=[],busy=false,toastTimer=null;
function id(){return'chat_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}function makeChat(){return{id:id(),title:'Новый диалог',messages:[],created:Date.now(),updated:Date.now()}}function active(){return chats.find(c=>c.id===activeId)||null}function notify(s){els.toast.textContent=s;els.toast.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>els.toast.classList.add('hidden'),3000)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({chats:chats.map(c=>({...c,messages:c.messages.map(m=>({role:m.role,content:m.content,time:m.time||Date.now(),files:(m.files||[]).map(f=>({name:f.name,type:f.type,size:f.size,preview:f.preview||''})),image:m.image||'',thinking:!!m.thinking}))})),activeId}))}catch(e){notify('История не сохранена: возможно, превышен лимит памяти браузера.')}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.chats)){chats=d.chats.filter(c=>c&&c.id&&Array.isArray(c.messages)).map(c=>({id:String(c.id),title:String(c.title||'Новый диалог'),created:Number(c.created)||Date.now(),updated:Number(c.updated)||Date.now(),messages:c.messages.map(m=>({role:m.role==='assistant'?'assistant':'user',content:String(m.content||''),time:Number(m.time)||Date.now(),files:Array.isArray(m.files)?m.files:[],image:typeof m.image==='string'?m.image:'',thinking:!!m.thinking}))}));activeId=d.activeId}}catch(e){chats=[]}if(!chats.length){const c=makeChat();chats=[c];activeId=c.id}if(!active())activeId=chats[0].id;save()}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function validURL(s){try{const u=new URL(s);return['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return''}}
function markdown(src){let s=escapeHTML(src),blocks=[];s=s.replace(/```([a-z0-9_-]*)\s*\n?([\s\S]*?)```/gi,(m,l,c)=>{let n=blocks.length;blocks.push('<pre><code>'+c.trim()+'</code></pre>');return'@@BLOCK'+n+'@@'});s=s.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g,(m,a,u)=>{u=validURL(u);return u?'<img loading="lazy" alt="'+a+'" src="'+u+'">':m});s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,a,u)=>{u=validURL(u);return u?'<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+a+'</a>':m});s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/^### (.+)$/gm,'<strong>$1</strong>').replace(/^## (.+)$/gm,'<strong>$1</strong>').replace(/^# (.+)$/gm,'<strong>$1</strong>').replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>').replace(/(^|\n)[-*] (.+)/g,'$1• $2').replace(/\n/g,'<br>');return s.replace(/@@BLOCK(\d+)@@/g,(m,n)=>blocks[+n]||'')}
function closeSidebar(){els.sidebar.classList.remove('open');els.overlay.classList.remove('show')}function openSidebar(){els.sidebar.classList.add('open');els.overlay.classList.add('show')}
function renderSidebar(){els.chatList.replaceChildren();[...chats].sort((a,b)=>b.updated-a.updated).forEach(c=>{const row=document.createElement('div');row.className='chat-row';const b=document.createElement('button');b.type='button';b.className='chat-item'+(c.id===activeId?' active':'');b.innerHTML='<span>◷</span><span class="chat-title"></span>';b.querySelector('.chat-title').textContent=c.title||'Новый диалог';b.addEventListener('click',()=>{activeId=c.id;save();renderAll();closeSidebar()});const del=document.createElement('button');del.type='button';del.className='delete-chat';del.textContent='×';del.title='Удалить диалог';del.addEventListener('click',e=>{e.stopPropagation();deleteChat(c.id)});row.append(b,del);els.chatList.append(row)})}
function formatBytes(n){if(n<1024)return n+' Б';if(n<1048576)return(n/1024).toFixed(1)+' КБ';return(n/1048576).toFixed(1)+' МБ'}function renderFileCard(f){const card=document.createElement('div');card.className='file-card';if(f.preview&&String(f.type).startsWith('image/')){const im=document.createElement('img');im.src=f.preview;im.alt=f.name;im.loading='lazy';card.append(im)}else if(f.preview&&String(f.type).startsWith('video/')){const v=document.createElement('video');v.controls=true;v.preload='metadata';v.src=f.preview;card.append(v)}else{const g=document.createElement('div');g.style.cssText='padding:22px;text-align:center;font-size:28px';g.textContent=String(f.type).startsWith('video/')?'🎬':'📄';card.append(g)}const meta=document.createElement('div');meta.className='file-meta';const name=document.createElement('strong');name.textContent=f.name||'Файл';const info=document.createElement('span');info.textContent=(f.type||'неизвестный тип')+' · '+formatBytes(f.size||0);meta.append(name,info);card.append(meta);return card}
function messageNode(m){const row=document.createElement('article');row.className='message-row '+(m.role==='user'?'user':'assistant');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=m.role==='user'?'Я':'D';const content=document.createElement('div');content.className='message-content';const name=document.createElement('div');name.className='message-name';name.textContent=m.role==='user'?'ТЫ':'DEEPKEY INTELLIGENCE';content.append(name);if(m.role==='assistant'&&m.thinking){const d=document.createElement('details');d.className='thinking';const s=document.createElement('summary');s.textContent='🧠 Объяснение подхода к решению';const x=document.createElement('div');x.className='thinking-content';x.innerHTML='<ol><li>Определить главную цель запроса и ограничения.</li><li>Разбить задачу на понятные этапы.</li><li>Сопоставить варианты и проверить полноту ответа.</li><li>Представить итог в удобной форме.</li></ol><p>Это общее объяснение метода, а не дословная внутренняя цепочка мыслей модели.</p>';d.append(s,x);content.append(d)}const body=document.createElement('div');body.className='message-body';body.innerHTML=markdown(m.content||'');content.append(body);if(m.image){const im=document.createElement('img');im.src=m.image;im.alt='Сгенерированное изображение';im.loading='lazy';body.append(im)}if(m.files&&m.files.length){const cards=document.createElement('div');cards.className='file-cards';m.files.forEach(f=>cards.append(renderFileCard(f)));content.append(cards)}if(m.role==='assistant'){const actions=document.createElement('div');actions.className='message-actions';const copy=document.createElement('button');copy.type='button';copy.className='small-btn';copy.textContent='Копировать';copy.addEventListener('click',()=>copyText(m.content||''));actions.append(copy);content.append(actions)}row.append(avatar,content);return row}
function renderMessages(){els.inner.replaceChildren();const c=active();if(!c||!c.messages.length){const w=document.createElement('div');w.className='welcome';w.innerHTML='<div class="welcome-logo">D</div><div class="eyebrow">YOUR PERSONAL INTELLIGENCE</div><h1>Мышление без<br><span class="gradient-text">границ.</span></h1><p>Идеи, код, исследования и творчество. Расскажи, что задумал, — начнём 🚀</p><div class="suggestions"><button class="suggestion" data-prompt="Придумай невероятно современный интерактивный сайт для молодёжи."><div class="s-icon">✦</div><strong>Придумать проект</strong><span>От идеи до готового решения</span></button><button class="suggestion" data-prompt="Объясни сложную научную тему на простых жизненных примерах и с иллюстрациями."><div class="s-icon">◈</div><strong>Разобраться в теме</strong><span>Наука, учёба и открытия</span></button><button class="suggestion" data-prompt="Напиши полностью готовый монолитный HTML-файл для эффектного интерактивного приложения."><div class="s-icon">⌘</div><strong>Создать приложение</strong><span>Код, который можно запустить</span></button><button class="suggestion" data-prompt="Помоги придумать и сгенерировать эффектную футуристическую иллюстрацию."><div class="s-icon">🎨</div><strong>Создать визуал</strong><span>Образы, стиль и вдохновение</span></button></div>';w.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{els.input.value=b.dataset.prompt;resizeInput();els.input.focus()}));els.inner.append(w)}else c.messages.forEach(m=>els.inner.append(messageNode(m)));if(busy){const t=document.createElement('article');t.className='message-row';t.innerHTML='<div class="avatar">D</div><div class="message-content"><div class="message-name">DEEPKEY INTELLIGENCE</div><div class="typing"><i></i><i></i><i></i></div></div>';els.inner.append(t)}requestAnimationFrame(()=>els.messages.scrollTop=els.messages.scrollHeight)}
function renderAttachments(){els.preview.replaceChildren();attachments.forEach((f,i)=>{const chip=document.createElement('div');chip.className='attachment-chip';if(f.preview&&String(f.type).startsWith('image/')){const im=document.createElement('img');im.src=f.preview;im.alt=f.name;chip.append(im)}else{const ico=document.createElement('span');ico.textContent=String(f.type).startsWith('video/')?'🎬':'📄';chip.append(ico)}const label=document.createElement('span');label.className='chip-text';label.textContent=f.name+' · '+formatBytes(f.size);chip.append(label);const rm=document.createElement('button');rm.type='button';rm.className='remove-attachment';rm.textContent='×';rm.setAttribute('aria-label','Удалить файл');rm.addEventListener('click',()=>{attachments.splice(i,1);renderAttachments()});chip.append(rm);els.preview.append(chip)})}function renderAll(){renderSidebar();renderMessages();renderAttachments()}
function newChat(){const c=makeChat();chats.unshift(c);activeId=c.id;attachments=[];els.input.value='';resizeInput();save();renderAll();closeSidebar();els.input.focus()}function deleteChat(cid){chats=chats.filter(c=>c.id!==cid);if(!chats.length){const c=makeChat();chats=[c];activeId=c.id}else if(activeId===cid)activeId=[...chats].sort((a,b)=>b.updated-a.updated)[0].id;save();renderAll();notify('Диалог удалён')}function clearChat(){const c=active();if(!c)return;c.messages=[];c.title='Новый диалог';c.updated=Date.now();attachments=[];save();renderAll();notify('Сообщения очищены')}function resizeInput(){els.input.style.height='auto';els.input.style.height=Math.min(els.input.scrollHeight,180)+'px'}
function guessType(name){const e=(name.split('.').pop()||'').toLowerCase();return({png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',mp4:'video/mp4',webm:'video/webm',txt:'text/plain',js:'text/javascript',py:'text/x-python',html:'text/html',css:'text/css',json:'application/json',md:'text/markdown',csv:'text/csv'})[e]||'application/octet-stream'}function isText(name,type){return/^text\//.test(type)||/\.(txt|js|py|html|css|json|md|csv|xml|log|ts|tsx|jsx|sql|sh|yml|yaml|svg)$/i.test(name)}
function readFile(file){return new Promise((resolve,reject)=>{const f={name:file.name,type:file.type||guessType(file.name),size:file.size,preview:'',text:''};if(f.type.startsWith('video/')){f.text='Видеофайл '+f.name+'. Тип: '+f.type+'. Размер: '+formatBytes(f.size)+'. Текстовый API не получает видеокадры автоматически.';resolve(f);return}const r=new FileReader();r.onerror=()=>reject(Error('Не удалось прочитать '+file.name));r.onload=()=>{if(f.type.startsWith('image/'))f.preview=String(r.result||'');else if(isText(f.name,f.type))f.text=String(r.result||'').slice(0,40000);else f.text='[Файл '+f.name+'. Тип: '+f.type+'. Размер: '+formatBytes(f.size)+'. Содержимое этого формата не прочитано браузером.]';resolve(f)};if(f.type.startsWith('image/'))r.readAsDataURL(file);else if(isText(f.name,f.type)){if(file.size>2*1024*1024){f.text='[Текстовый файл больше 2 МБ. Содержимое не прочитано.]';resolve(f)}else r.readAsText(file)}else{f.text='[Файл '+f.name+'. Тип: '+f.type+'. Размер: '+formatBytes(f.size)+'. Содержимое не извлечено автоматически.]';resolve(f)}})}async function handleFiles(list){for(const file of Array.from(list||[])){if(file.size>15*1024*1024){notify('Файл больше 15 МБ: '+file.name);continue}try{attachments.push(await readFile(file))}catch(e){notify(e.message||'Ошибка чтения файла')}}renderAttachments();if(attachments.length)notify('Файл прикреплён ✓')}
function attachmentContext(files){if(!files.length)return'';return'\n\nПРИКРЕПЛЁННЫЕ ФАЙЛЫ:\n'+files.map(f=>f.text?'Файл: '+f.name+'\nТип: '+f.type+'\n'+f.text:f.type.startsWith('image/')?'Изображение: '+f.name+'. Тип: '+f.type+'. Изображение прикреплено в интерфейсе; передача содержимого модели зависит от API.':'Видеофайл: '+f.name+'. Тип: '+f.type+'. Размер: '+formatBytes(f.size)+'. Этот текстовый API не получает видеокадры автоматически.').join('\n\n')}
function imagePrompt(text){const t=text.trim();let m=t.match(/^!фото\s+([\s\S]+)/i)||t.match(/^\/image\s+([\s\S]+)/i);if(m)return m[1].trim();m=t.match(/^(?:нарисуй|сгенерируй изображение|создай изображение|сделай картинку)\s*[:,-]?\s*([\s\S]+)/i);return m&&m[1].trim()?m[1].trim():''}function imageURL(p){return'https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?width=800&height=600&nologo=true'}
async function requestAI(prompt,chat){const mode=els.model.value,depth=els.depth.value;const system=mode==='deepdebil'?'Используй сатирический, дерзкий, грубоватый юмор и лёгкие подколы, иногда разговорную ругань, но оставайся полезным. Не унижай людей по защищённым признакам и ясно отвечай по существу.':'Ты DeepKey AI — умный, дружелюбный современный ассистент. Отвечай на языке пользователя, структурируй сложные ответы, используй уместные эмодзи. Для кода выдавай полные рабочие решения. Если уместно, добавляй Markdown-картинки только с известными публичными URL, не выдумывай ссылки. Не заявляй, что анализируешь медиа, если API не передаёт содержимое. Режим глубины: '+depth+'.';const history=chat.messages.slice(-12).map(m=>({role:m.role,content:m.content}));const msgs=[{role:'system',content:system},...history,{role:'user',content:prompt}];const eps=[{url:'https://text.pollinations.ai/openai',method:'POST',body:{model:'openai',messages:msgs,temperature:mode==='deepdebil'?.85:.6}},{url:'https://text.pollinations.ai/openai',method:'POST',body:{model:'llama',messages:msgs,temperature:.7}},{url:'https://text.pollinations.ai/'+encodeURIComponent(prompt),method:'GET'}];let last=null;for(const ep of eps){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),55000);try{const opts={method:ep.method,signal:controller.signal};if(ep.method==='POST'){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(ep.body)}const res=await fetch(ep.url,opts);if(!res.ok)throw Error('HTTP '+res.status);const ct=res.headers.get('content-type')||'',data=ct.includes('application/json')?await res.json():await res.text();const answer=typeof data==='string'?data:(data.choices?.[0]?.message?.content||data.response||data.output||data.text||'');if(String(answer).trim())return String(answer).trim();throw Error('Пустой ответ API')}catch(e){last=e}finally{clearTimeout(timer)}}throw Error('Все три попытки подключения не удались. Проверь интернет и доступность API.'+(last&&last.name==='AbortError'?' Запрос превысил лимит времени.':''))}
function setBusy(v){busy=v;els.send.disabled=v;els.send.textContent=v?'…':'➤';els.status.textContent=v?'Обрабатываю запрос…':'Готов к работе';renderMessages()}
async function sendMessage(){if(busy)return;const text=els.input.value.trim();if(!text&&!attachments.length){notify('Напиши сообщение или прикрепи файл');els.input.focus();return}const c=active();if(!c){notify('Создай новый диалог');return}const files=attachments.map(f=>({...f})),savedFiles=files.map(f=>({name:f.name,type:f.type,size:f.size,preview:f.preview||''})),userText=text||'Посмотри прикреплённые файлы и помоги разобраться.',imgPrompt=imagePrompt(text);c.messages.push({role:'user',content:userText,files:savedFiles,time:Date.now()});if(c.title==='Новый диалог')c.title=userText.replace(/\s+/g,' ').slice(0,38)||'Новый диалог';c.updated=Date.now();const prompt=userText+attachmentContext(files);els.input.value='';resizeInput();attachments=[];renderAttachments();save();setBusy(true);try{if(imgPrompt){c.messages.push({role:'assistant',content:'🎨 Генерирую изображение по запросу: **'+imgPrompt+'**\n\nЕсли картинка не загрузится, попробуй повторить запрос позже.',image:imageURL(imgPrompt),thinking:false,time:Date.now()})}else{const answer=await requestAI(prompt,c);c.messages.push({role:'assistant',content:answer,thinking:els.model.value==='deepkey'&&els.depth.value!=='medium',time:Date.now()})}}catch(e){c.messages.push({role:'assistant',content:'⚠️ '+(e.message||'Не удалось получить ответ')+'\n\nПроверь интернет-соединение. Если сервис временно недоступен, попробуй ещё раз позднее.',thinking:false,time:Date.now()})}finally{c.updated=Date.now();save();setBusy(false);renderAll();els.input.focus()}}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error()}notify('Скопировано ✓')}catch(e){notify('Не удалось скопировать текст')}}function exportChat(){const c=active();if(!c||!c.messages.length){notify('В этом диалоге пока нет сообщений');return}const data=c.messages.map(m=>(m.role==='user'?'ТЫ':'DEEPKEY AI')+':\n'+m.content+'\n'+(m.files||[]).map(f=>'Файл: '+f.name).join('\n')).join('\n\n-----------------\n\n');const blob=new Blob([data],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(c.title||'deepkey-chat').replace(/[\\/:*?"<>|]/g,'_')+'.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}function imageButton(){const t=els.input.value.trim();els.input.value=t?'Нарисуй '+t:'!фото ';resizeInput();els.input.focus();els.input.setSelectionRange(els.input.value.length,els.input.value.length);notify('Опиши картинку и нажми «Отправить»')}function about(){alert('DeepKey AI\n\nФутуристичный ИИ-интерфейс с локальной историей чатов, файлами, видео-карточками и генерацией изображений.\n\nТекстовый API не анализирует видеокадры автоматически. Для полноценного мультимодального анализа потребуется совместимый API.\n\nОтветы ИИ и генерация картинок требуют интернета.')}
$('newChatBtn').addEventListener('click',newChat);els.send.addEventListener('click',sendMessage);els.input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}});els.input.addEventListener('input',resizeInput);$('attachBtn').addEventListener('click',()=>els.file.click());els.file.addEventListener('change',async e=>{await handleFiles(e.target.files);e.target.value=''});$('imageBtn').addEventListener('click',imageButton);$('exportBtn').addEventListener('click',exportChat);$('clearBtn').addEventListener('click',()=>{if(confirm('Очистить сообщения текущего диалога?'))clearChat()});$('aboutBtn').addEventListener('click',about);$('menuBtn').addEventListener('click',openSidebar);els.overlay.addEventListener('click',closeSidebar);els.model.addEventListener('change',()=>notify('Модель: '+els.model.options[els.model.selectedIndex].text));els.depth.addEventListener('change',()=>notify('Режим: '+els.depth.options[els.depth.selectedIndex].text));load();renderAll();resizeInput();
})();
